[env:esp32dev]               ; típico para ESP32-WROOM-32 DevKitC
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM5         ; opcional, si querés fijarlo
extra_scripts = pre:scripts/mqtt_node_env.py
; NODE_ID: build-time env for MQTT topics bicicletero/esp/<NODE_ID>/{requests,responses}
; SYSTEM_MODE: edit src/config/app_config.h or build_flags = '-DSYSTEM_MODE=1'
; build_flags =
;   '-DSYSTEM_MODE=1'

lib_deps =
  knolleary/PubSubClient
lib_ldf_mode = deep+
