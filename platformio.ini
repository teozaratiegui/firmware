; ESP32-WROOM-32 DevKitC + R200 UHF RFID reader
;
; Build-time switches (all of them require a rebuild and a reflash):
;   SYSTEM_MODE=0|1        0 = RFID (default), 1 = telemetry only, reader off
;   GATEWAY_USE_MQTT=0|1   1 = MQTT to the Fog gateway (default)
;                          0 = HTTPS straight to the Lambda, Fog bypassed
;   MESSAGE_GATEWAY=0|1    0 = no uplink at all (serial bring-up)
;   APP_MQTT_HOST="ip"     broker address, overrides src/config/app_config.h
;   APP_NODE_PREFIX / APP_GATEWAY_PREFIX   MQTT topic prefixes. Each has its own
;                          counterpart on the gateway: APP_MQTT_TOPIC and
;                          APP_MQTT_GATEWAY_PREFIX. Changing one side only is
;                          silent — the node publishes where nobody listens.
;   NODE_ID                environment variable, not a build flag: the fallback
;                          node id used only by the direct-to-Lambda mode.
;                          Over MQTT the gateway assigns the real one.
;
; Overriding a switch means passing it through PLATFORMIO_BUILD_FLAGS:
;
;   PLATFORMIO_BUILD_FLAGS='-DSYSTEM_MODE=1' pio run
;   PLATFORMIO_BUILD_FLAGS='-DGATEWAY_USE_MQTT=0 -DAPP_MQTT_HOST=\"192.168.0.20\"' pio run
;
; NOT `pio run -a '-DSYSTEM_MODE=1'`: -a is --program-arg, PlatformIO ignores it
; for build flags and builds the default firmware without saying anything.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; upload_port = /dev/cu.usbserial-0001   ; uncomment to pin the port
extra_scripts = pre:scripts/direct_node_id.py

build_flags =
  -Wall
  -Wextra

lib_deps =
  knolleary/PubSubClient@^2.8
  bblanchon/ArduinoJson@^7.0.4

lib_ldf_mode = deep+
